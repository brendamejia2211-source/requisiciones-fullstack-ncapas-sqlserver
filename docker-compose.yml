services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RequiPro_SA_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RequiPro_SA_2026!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'RequiPro_SA_2026!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: node:20
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "sqlserver://db:1433;database=requisiciones;user=sa;password=RequiPro_SA_2026!;encrypt=false;trustServerCertificate=true"
      JWT_SECRET: "demo-secret-change-in-production"
      PORT: 4000
      UPLOAD_DIR: uploads
    command: sh -c "npm install && node src/create-db.js && npx prisma generate && npx prisma db push && npm run seed && npm start"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:4000/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sqldata:
